<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#233D5D">
  <meta name="description" content="Humor dev, inspiração e insights para pessoas desenvolvedoras.">

  <title>hello_world.exe</title>

  <link rel="stylesheet" href="style.css">

  <script src="messages.js" defer></script>
<script src="gifs.js" defer></script>
<script src="script.js" defer></script>
</head>

<body>
  <main>
    <section class="terminal">
      <div class="topbar" aria-hidden="true">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="filename">greetings.exe</span>
      </div>

      <div class="content">

        <!-- Cabeçalho -->
        <div class="header-content">
          <h1 class="title">Log de Insights</h1>

          <p class="subtitle">
            Humor dev, motivação e pensamentos para impulsionar seu dia e seus commits.
          </p>

          <div class="prompt-header">
            <p class="prompt">&gt; generate_phrase()</p>
            <span class="badge" id="category"></span>
          </div>
        </div>

        <!-- Mensagem -->
        <div class="middle-content">
          <div class="phrase" id="phrase" aria-live="polite">
            Hello, World! Você desbloqueou uma mensagem secreta.
          </div>
        </div>

        <!-- GIF: aparece após o desbloqueio -->
        <div class="gif-container" id="gifContainer" hidden>
          <img
            id="teamGif"
            src="https://media.giphy.com/media/l0G17m03uuLd7828U/giphy.gif"
            alt="GIF relacionado ao insight"
          >
        </div>

        <!-- Ações -->
        <div class="footer-content">
  <div class="actions">
    <button class="primary" id="generate" type="button">
      Ver insight
    </button>

    <div class="secondary-actions" id="secondaryActions" hidden>
      <button class="secondary" id="share" type="button">
        Compartilhar ↗
      </button>

      <button class="secondary" id="copy" type="button">
        Copiar ⧉
      </button>
    </div>
  </div>
</div>
    </section>
  </main>
</body>

</html>
